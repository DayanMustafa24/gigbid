[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: a multi-agent freelancer copilot (LangGraph + MCP + advanced RAG)"
requires-python = ">=3.11,<3.14"
dependencies = [
  # agents / MCP
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.2,<4",
  "langchain-mcp-adapters>=0.3,<0.4",
  "langchain-openai>=1.8,<2",          # OpenAI-compatible client: Ollama, Groq, OpenRouter, vLLM
  "mcp>=1.30,<2",                       # 2.x not supported by langchain-mcp-adapters yet
  # api
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy[asyncio]>=2.1,<3",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.3,<4",
  "pgvector>=0.5,<1",
  "redis>=5",
  "arq>=0.28,<1",
  "httpx>=0.27",
  "pyyaml>=6",
  "python-dotenv>=1",
  "cryptography>=45",
  "pyjwt>=2.9",
  "sse-starlette>=2",
  # rag
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "pypdf>=5",
]

[project.optional-dependencies]
# heavy ML pieces (embeddings, reranker): CPU is fine. Install with: uv sync --extra ml
ml = ["sentence-transformers>=6,<7"]
obs = [
  "arize-phoenix-otel",
  "openinference-instrumentation-langchain>=0.1.86",
  "opentelemetry-sdk",
]
data = ["pandas>=2.2", "pyarrow>=16", "reportlab>=4"]
eval = ["scipy>=1.13", "scikit-learn>=1.5", "matplotlib>=3.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
package = false          # flat multi-package layout, not a wheel; `uv sync` pins via uv.lock

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
# generated synthetic portfolio code (data/synthetic/**/src/*.py) is evidence text, not project code
extend-exclude = ["data", "evals/datasets"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"scripts/synth/**" = ["E501"]
