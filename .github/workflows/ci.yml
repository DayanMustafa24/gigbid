name: CI
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: OpenAPI contract is committed and current
        run: uv run python -m scripts.export_openapi --check
      - name: Repo rules (no secrets, prompts only in agent/prompts, cited results exist)
        run: uv run python -m scripts.check_repo_rules

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gigbid -d gigbid" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://gigbid:gigbid@localhost:5432/gigbid
      APP_DATABASE_URL: postgresql+psycopg://gigbid:gigbid@localhost:5432/gigbid
      GIGBID_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run python -m scripts.postgres_smoke
      - run: uv run pytest -q tests/integration/test_checkpointing.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

  compose-smoke:
    # builds every image, starts the whole stack (postgres, redis, phoenix, gigsim, 3 MCP servers, api, worker, web) and drives it with a real browser
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Create a throw-away .env
        run: |
          cat > .env <<EOF
          APP_SECRET_KEY=$(openssl rand -hex 32)
          TOKEN_ENCRYPTION_KEY=$(python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          MCP_BEARER_TOKEN=$(openssl rand -hex 24)
          REVIEWER_EMAIL=reviewer@example.com
          REVIEWER_PASSWORD=Reviewer-Pass-12345
          GIGSIM_DATASET=sample
          GIGSIM_FAULT_RATE=0
          EOF
      - name: Start the stack
        run: docker compose --env-file .env -f infra/docker-compose.yml up -d --build --wait --wait-timeout 900
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Live smoke (real browser, nothing mocked)
        working-directory: apps/web
        env:
          LIVE_URL: http://localhost:3000
          REVIEWER_EMAIL: reviewer@example.com
          REVIEWER_PASSWORD: Reviewer-Pass-12345
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:live
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/docker-compose.yml logs --no-color --tail=200
      - name: Stop
        if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down -v
